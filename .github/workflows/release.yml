name: Release (crates.io)

# Adapted from parsanol/parsanol-rs release.yml. That workflow runs
# release-plz on every push to main; here a release is explicit: push a
# version tag (vX.Y.Z) on a main commit, or run the workflow by hand from
# main. A manual run only packages and dry-runs unless `publish` is ticked.
# Merging this workflow publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io (unticked: package and dry run only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Check the tag is on main and matches the crate version
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match crate version $version"; exit 1; }
      - name: Package and dry run
        run: cargo +stable publish --locked --dry-run
      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] \
            || { echo "::error::the CARGO_REGISTRY_TOKEN secret is not set"; exit 1; }
          cargo +stable publish --locked
