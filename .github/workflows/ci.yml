name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.86.0
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: cargo test --all-targets
        run: cargo +${{ matrix.rust }} test --all-targets
      - name: cargo build --lib
        run: cargo +${{ matrix.rust }} build --lib

  testsuite-replay:
    name: unitsml-testsuite replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Same unitsml-testsuite commit unitsml-ruby replays
      # (unitsml-ruby spec/fixtures/testsuite-pin.yml). Move both together.
      - name: Check out pinned unitsml-testsuite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: unitsml/unitsml-testsuite
          ref: 087e4ee60eb402d6436ae919f50a187faec2abb7
          path: unitsml-testsuite
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --manifest-path testsuite-replay/Cargo.toml --all -- --check
      - name: Replay F40 and conversion corpora
        env:
          UNITSML_TESTSUITE_DIR: ${{ github.workspace }}/unitsml-testsuite
        run: cargo +stable test --locked --manifest-path testsuite-replay/Cargo.toml
