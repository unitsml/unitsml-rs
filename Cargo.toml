[package]
name = "unitsml-rs"
version = "0.1.0"
edition = "2021"
description = "Exact UnitsML quantity algebra over resolved unit operands"
license-file = "LICENSE.md"
include = ["src/**", "tests/**", "include/**", "README.md", "LICENSE.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
unitsdb-rs = { version = "=0.1.0", path = "../unitsdb-rs" }
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
serde_json = "1.0"
